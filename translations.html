<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Translations — Nada Hodali</title>
<link rel="icon" type="image/png" href="assets/leaf.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=24" />
<style class="translations-page">
  /* translations.html only — makes the library fill the space under the header */
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;      /* lets the iframe shrink correctly inside flex */
  }
  .library-frame {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    display: block;
    background: #eee8db; /* matches the shelf's paper tone — no white flash while loading */
  }
</style>
</head>
<body class="translations-page">

  <header class="site-header">
    <span class="header-left">ENGLISH &mdash; ARABIC</span>
    <nav class="header-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="translations.html" aria-current="page">Translations</a>
      <a href="writing.html">Writing</a>
      <a href="about.html">Contact me</a>
    </nav>
    <span class="header-right">
      <a class="header-logo-link" href="index.html" aria-label="Nada Hodali &mdash; home">
        <img class="header-logo" src="assets/nada-logo-colored.png" alt="Nada Hodali &mdash; Translations" width="358" height="132" />
      </a>
    </span>
  </header>

  <main>
    <iframe
      id="library-frame"
      class="library-frame"
      src="translations/"
      title="Translations library — an interactive 3D bookshelf"
      loading="eager"
      allow="fullscreen"
    ></iframe>
  </main>

  <script>
    // Deep link: index.html links book titles as translations.html?book=<id>.
    // The shelf app has no URL routing, but it is same-origin, so we drive its
    // DOM directly — click the matching catalog tick once the shelf is ready.
    (function () {
      // slug -> the book's exact catalog `title`. The shelf labels each tick
      // "Browse to <title>", so we find the tick by label instead of by
      // position and never depend on the shelf's sort order. Copy a new book's
      // title verbatim from the catalog when adding a link.
      var TITLES = {
        "this-moment": "This Moment",
        "i-feel-fortunate": "I FEEL FORTUNATE",
        "30-seconds-from-gaza": "30 Seconds from Gaza",
        "stolen-sold": "Stolen, Sold and Left to Rot",
        "behind-the-walls": "Behind the Walls",
        "a-novel-for-my-story-2": "A Novel for My Story (from \u201cPalestine Is Everywhere\u201d, published in Mousse Fall 25 Edition by Mousse Magazine.",
        "a-novel-for-my-story": "A Novel for My Story",
        "the-shadow-of-hermaphroditus": "THE SHADOW OF HERMAPHRODITUS",
        "the-journey-of-abbas": "The Journey of Abbas Hilmi Pasha II, Khedive of Egypt, to the Hijaz",
        "my-romantic-aunt": "My Romantic Aunt",
        "beyond-the-steppe": "Beyond the Steppe",
        "palestine-is-everywhere": "Palestine Is Everywhere",
        "safaa-and-the-tent": "Safaa and the Tent"
      };

      var wanted = new URLSearchParams(window.location.search).get("book");
      if (!wanted) return;

      var wantedLabel = TITLES[wanted];
      if (!wantedLabel) return;
      wantedLabel = "Browse to " + wantedLabel;

      var frame = document.getElementById("library-frame");
      var deadline = Date.now() + 20000; // give the shelf up to 20s to boot
      var clicks = 0;

      function shelfDoc() {
        try {
          return frame.contentDocument;
        } catch (e) {
          return null; // cross-origin — nothing we can do
        }
      }

      function ready(doc) {
        // The shelf paints a full-screen loading screen until every volume is
        // assembled; its onClick handlers only fire once that clears.
        var loader = doc.querySelector(".loading-screen");
        var loading = loader && loader.getAttribute("aria-hidden") !== "true";
        var ticks = doc.querySelectorAll(".shelf-index__ticks button");
        var tick = null;
        for (var i = 0; i < ticks.length; i++) {
          if (ticks[i].getAttribute("aria-label") === wantedLabel) tick = ticks[i];
        }
        return !loading && tick ? tick : null;
      }

      function trySelect() {
        if (Date.now() > deadline) return;

        var doc = shelfDoc();
        var tick = doc && ready(doc);
        if (!tick) {
          setTimeout(trySelect, 250);
          return;
        }

        tick.click();
        clicks++;

        // browseTo() is idempotent; click a couple more times in case the very
        // first one lands before the controller ref is wired up.
        if (clicks < 3) {
          setTimeout(trySelect, 400);
          return;
        }

        // Then open the book's detail view once browsing settles.
        setTimeout(function () {
          var d = shelfDoc();
          var inspect = d && d.querySelector('[data-testid="inspect-active"]');
          if (inspect && !inspect.disabled) inspect.click();
        }, 900);
      }

      frame.addEventListener("load", function () {
        setTimeout(trySelect, 250);
      });
    })();
  </script>

</body>
</html>
